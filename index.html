<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Focus Board</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Instrument+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: slim top bar (title, sync dot, small account button, Board / Notes switch).
   Board is a 2x2 priority matrix. Notes open on the recent-notes list; on phones the list has
   a bottom bar with New note and Folders, and folders / editor are separate full-screen panes. */
:root{
  --bg:#e6d6e0; --surface:#ffffff; --surface-2:#f6eff3; --ink:#18212a; --muted:#6a5c66; --line:#d9c5d2;
  --accent:#8a3f6e; --accent-ink:#ffffff; --accent-soft:#f0dde8;
  --q-do:#b8422f; --q-do-soft:#f8e1dc;
  --q-sch:#2a64ad; --q-sch-soft:#dbe7f6;
  --q-del:#946110; --q-del-soft:#f5e9d0;
  --q-no:#5d6874; --q-no-soft:#e5e8ec;
  --danger:#b8422f; --danger-ink:#ffffff;
  --ok:#2f9e63; --warn:#c98a1b;
  --shadow:0 1px 2px rgba(20,30,40,.06),0 8px 24px rgba(20,30,40,.08);
  --font-display:"Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",sans-serif;
  --font-body:"Instrument Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --radius:14px;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#241a22; --surface:#2e222c; --surface-2:#382b36; --ink:#e7ecf1; --muted:#aa9aa5; --line:#493945;
    --accent:#d08ab5; --accent-ink:#2a0f20; --accent-soft:#3a1f30;
    --q-do:#ef8a78; --q-do-soft:#3a201b;
    --q-sch:#7fb0ee; --q-sch-soft:#1b2b40;
    --q-del:#e0ae5c; --q-del-soft:#3a2d15;
    --q-no:#a2adb9; --q-no-soft:#242c35;
    --danger:#ef8a78; --danger-ink:#2a0d08;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#241a22; --surface:#2e222c; --surface-2:#382b36; --ink:#e7ecf1; --muted:#aa9aa5; --line:#493945;
  --accent:#d08ab5; --accent-ink:#2a0f20; --accent-soft:#3a1f30;
  --q-do:#ef8a78; --q-do-soft:#3a201b;
  --q-sch:#7fb0ee; --q-sch-soft:#1b2b40;
  --q-del:#e0ae5c; --q-del-soft:#3a2d15;
  --q-no:#a2adb9; --q-no-soft:#242c35;
  --danger:#ef8a78; --danger-ink:#2a0d08;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35);
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font:15px/1.45 var(--font-body);
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  overflow:hidden;
}
button{font:inherit;color:inherit}
[hidden]{display:none!important}
.ico{display:inline-flex;flex:none}
.ico svg{display:block}

.app{height:100%;min-height:520px;max-width:1280px;margin:0 auto;display:flex;flex-direction:column;gap:12px;padding-block:12px}

/* top bar */
.top{display:flex;align-items:center;gap:10px 12px;flex-wrap:wrap;flex:none}
.tabs{order:-1;flex:1 1 200px;min-width:0;max-width:420px;display:inline-flex;background:var(--surface-2);border:1px solid var(--line);border-radius:999px;padding:3px}
.tabs button{flex:1;min-width:0;white-space:nowrap;border:0;background:none;padding:7px 10px;border-radius:999px;font-weight:600;color:var(--muted);cursor:pointer}
.tabs button[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(20,30,40,.12)}
.sync{margin-left:auto;display:flex;align-items:center;padding:6px}
.sync::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--muted)}
.sync[data-s="ok"]::before{background:var(--ok)}
.sync[data-s="busy"]::before,.sync[data-s="local"]::before{background:var(--warn)}
.sync[data-s="err"]::before{background:var(--danger)}
.avatar{width:30px;height:30px;border-radius:50%;border:1px solid var(--line);background:var(--accent-soft);color:var(--accent);font-weight:700;font-size:13px;display:inline-grid;place-items:center;cursor:pointer;padding:0;flex:none}
.avatar:hover{border-color:var(--accent)}
.banner{flex:none;background:var(--q-del-soft);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:9px 12px;font-size:13px}
.view{flex:1;min-height:0}

/* buttons and fields */
.btn{font-weight:600;border-radius:10px;padding:9px 14px;border:1px solid var(--line);background:var(--surface);cursor:pointer;display:inline-flex;align-items:center;gap:6px;justify-content:center}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.btn.primary:hover{filter:brightness(1.1)}
.btn.small{padding:6px 10px;font-size:13px}
.btn.danger{color:var(--danger)}
.btn.danger.armed{background:var(--danger);color:var(--danger-ink);border-color:transparent}
.btn[disabled],button[disabled]{opacity:.5;cursor:not-allowed}
.icon-btn{border:0;background:none;width:34px;height:34px;border-radius:8px;display:inline-grid;place-items:center;color:var(--muted);cursor:pointer;flex:none}
.icon-btn:hover{background:var(--surface-2);color:var(--ink)}
:is(button,input,textarea,select):focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input,textarea,select{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%;min-width:0}
textarea{resize:vertical}
label.f{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:600;color:var(--muted)}
@media(max-width:820px){input,textarea,select{font-size:16px}}

/* board */
.board{display:flex;flex-direction:column;gap:12px;overflow-y:auto;padding-bottom:4px}
.quick{display:flex;gap:8px;flex:none}
.quick input{flex:1}
.quick select{width:auto;flex:none}
@media(max-width:560px){.quick{flex-wrap:wrap}.quick input{flex-basis:100%}.quick select{flex:1}}
.matrix{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));grid-template-rows:minmax(110px,auto);grid-auto-rows:minmax(200px,1fr);gap:12px;flex:1 0 auto}
.quad[data-q="today"]{--qc:var(--accent);--qs:var(--accent-soft);grid-column:1/-1}
@media(max-width:700px){.matrix{grid-template-columns:minmax(0,1fr);grid-auto-rows:minmax(150px,auto)}}
.quad{--qc:var(--q-do);--qs:var(--q-do-soft);background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.quad[data-q="schedule"]{--qc:var(--q-sch);--qs:var(--q-sch-soft)}
.quad[data-q="delegate"]{--qc:var(--q-del);--qs:var(--q-del-soft)}
.quad[data-q="eliminate"]{--qc:var(--q-no);--qs:var(--q-no-soft)}
.quad.over{outline:2px dashed var(--qc);outline-offset:-2px;background:var(--qs)}
.q-head{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.q-dot{width:10px;height:10px;border-radius:3px;background:var(--qc);flex:none}
.q-head h2{font:700 16px/1.2 var(--font-display);margin:0}
.q-hint{color:var(--muted);font-size:12px}
.q-count{margin-left:auto;background:var(--qs);color:var(--qc);font-size:12px;font-weight:700;min-width:24px;text-align:center;border-radius:999px;padding:2px 8px;font-variant-numeric:tabular-nums}
.tasks{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;flex:1;align-content:start}
.task{display:flex;gap:8px;align-items:flex-start;padding:8px 10px 8px 6px;border-radius:10px;background:var(--surface-2);border:1px solid transparent;cursor:grab}
.task:hover{border-color:var(--line)}
.task.dragging{opacity:.4}
.check{position:relative;flex:none;width:32px;height:32px;margin:-3px 0 -3px 0;background:none;border:0;display:grid;place-items:center;cursor:pointer;padding:0}
.check::before{content:"";width:20px;height:20px;border-radius:50%;border:2px solid var(--qc)}
.check::after{content:"";position:absolute;left:50%;top:50%;width:5px;height:10px;border:solid var(--surface);border-width:0 2px 2px 0;transform:translate(-50%,-62%) rotate(45deg);opacity:0}
.task.done .check::before{background:var(--qc)}
.task.done .check::after{opacity:1}
.task-main{flex:1;min-width:0;text-align:left;background:none;border:0;padding:3px 0 0;cursor:pointer;display:flex;flex-direction:column;gap:2px}
.t-title{font-weight:500;overflow-wrap:anywhere}
.t-desc{color:var(--muted);font-size:13px;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.task.done .t-title{text-decoration:line-through;color:var(--muted)}
.empty{color:var(--muted);font-size:13px;padding:6px 2px}
.board-foot{display:flex;align-items:center;gap:12px;flex:none;color:var(--muted);font-size:13px;min-height:34px}

/* notes */
.notes{display:grid;grid-template-columns:230px 310px minmax(0,1fr);gap:12px;height:100%}
@media(max-width:1000px){.notes{grid-template-columns:200px 260px minmax(0,1fr)}}
.pane{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);display:flex;flex-direction:column;min-height:0;min-width:0;overflow:hidden}
.pane-head{display:flex;align-items:center;gap:6px;padding:10px 10px 8px 14px;flex:none}
.pane-head h2{font:700 16px/1.2 var(--font-display);margin:0;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.scroll{overflow-y:auto;flex:1;min-height:0}
.back{display:none;border:0;background:none;color:var(--accent);font-weight:600;cursor:pointer;padding:6px 6px 6px 0;align-items:center;gap:2px}
.folder-list,.note-list{list-style:none;margin:0;padding:2px 8px 12px;display:flex;flex-direction:column;gap:2px}
.f-item{display:flex;align-items:center;border-radius:10px}
.f-item.active{background:var(--accent-soft)}
.f-row{flex:1;min-width:0;display:flex;gap:8px;align-items:center;padding:9px 10px;background:none;border:0;text-align:left;cursor:pointer;border-radius:10px}
.f-name{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:500}
.f-count{margin-left:auto;color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums}
.chips{display:flex;gap:6px;flex-wrap:wrap;padding:4px 6px}
.chip{border:1px dashed var(--line);background:none;border-radius:999px;padding:5px 11px;font-size:13px;color:var(--muted);cursor:pointer}
.chip:hover{color:var(--ink);border-color:var(--muted)}
.search{padding:0 12px 8px;flex:none}
.note-item{width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:11px 10px;border-radius:0;display:flex;flex-direction:column;gap:3px;cursor:pointer;min-width:0}
.note-item.active{background:var(--accent-soft);border-radius:10px;border-bottom-color:transparent}
.n-title{display:flex;gap:6px;align-items:center;font-weight:600;min-width:0}
.n-title span.t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.n-title .ico{color:var(--accent)}
.n-sub{color:var(--muted);font-size:13px;display:flex;gap:8px;min-width:0}
.n-date{flex:none;font-variant-numeric:tabular-nums}
.n-prev{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.n-folder{font-size:12px;color:var(--accent);display:flex;gap:4px;align-items:center}
.list-foot{display:none;gap:8px;padding:10px 12px;border-top:1px solid var(--line);flex:none}
.list-foot .btn{padding:12px 16px}
.list-foot .primary{flex:1}
.ed-bar{display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid var(--line);flex-wrap:wrap;flex:none}
.ed-bar select{width:auto;max-width:200px;padding:7px 10px}
.ed-bar .grow{margin-left:auto}
.ed-main{display:flex;flex-direction:column;flex:1;min-height:0}
#note-body{flex:1;resize:none;border:0;border-radius:0;padding:16px 20px;font-size:16px;line-height:1.6;background:transparent;min-height:0}
#note-body:focus-visible{outline:none}
.ed-meta{padding:8px 20px 12px;font-size:12px;color:var(--muted);border-top:1px solid var(--line);flex:none}
.ed-empty,.list-empty{display:flex;flex-direction:column;gap:10px;align-items:center;justify-content:center;text-align:center;color:var(--muted);padding:28px 20px}
.ed-empty{flex:1}
@media(max-width:820px){
  .notes{grid-template-columns:minmax(0,1fr)}
  .notes[data-pane="folders"] #pane-list,.notes[data-pane="folders"] #pane-editor,
  .notes[data-pane="list"] #pane-folders,.notes[data-pane="list"] #pane-editor,
  .notes[data-pane="editor"] #pane-folders,.notes[data-pane="editor"] #pane-list{display:none}
  .back{display:inline-flex}
  .ed-empty{display:none}
  .list-foot{display:flex}
  #new-note{display:none}
}

.f-item.drop{background:var(--accent-soft);outline:2px dashed var(--accent);outline-offset:-2px}
.quick.inline{flex-wrap:nowrap}
.quick.inline input{flex:1 1 auto}

/* shopping lists */
.shop{display:flex;flex-direction:column;gap:12px;overflow-y:auto;padding-bottom:4px}
.s-lists{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;flex:none;scrollbar-width:none}
.s-lists::-webkit-scrollbar{display:none}
.s-chip{flex:none;display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 14px;font-weight:600;cursor:pointer}
.s-chip.active{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.s-chip.add{border-style:dashed;background:none;color:var(--muted)}
.s-count{font-size:12px;font-variant-numeric:tabular-nums;opacity:.8}
.s-panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px;display:flex;flex-direction:column;gap:12px;min-width:0}
.s-head{display:flex;align-items:center;gap:8px}
.s-head h2{font:700 18px/1.2 var(--font-display);margin:0;flex:1;min-width:0;overflow-wrap:anywhere}
.s-items{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.s-item{--qc:var(--accent);display:flex;gap:8px;align-items:center;padding:8px 10px 8px 6px;border-radius:10px;background:var(--surface-2)}
.s-text{flex:1;min-width:0;text-align:left;background:none;border:0;padding:3px 0;cursor:pointer;font-weight:500;overflow-wrap:anywhere}
.s-item.done .s-text{text-decoration:line-through;color:var(--muted)}
.s-item.done .check::before{background:var(--qc)}
.s-item.done .check::after{opacity:1}
.s-empty{padding:28px 8px;text-align:center;color:var(--muted);display:flex;flex-direction:column;gap:12px;align-items:center}
.s-empty .chips{justify-content:center}

/* meal planner */
.meals{overflow-y:auto}
.m-wrap{display:flex;flex-direction:column;gap:14px;padding-bottom:4px;max-width:720px}
.m-head{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.m-head h2,.m-title{font:700 18px/1.2 var(--font-display);margin:0 auto 0 0}
.m-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px;display:flex;flex-direction:column;gap:12px;min-width:0}
.m-note{color:var(--muted);margin:0}
.m-meals{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:14px}
.m-meal{display:flex;gap:10px 12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.m-info{display:flex;flex-direction:column;gap:1px;min-width:0}
.m-cat{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--accent)}
.m-name{font-weight:600;font-size:16px;overflow-wrap:anywhere}
.m-sub{color:var(--muted);font-size:13px}
a.btn{text-decoration:none;color:inherit}
.m-shop{border-top:1px solid var(--line);padding-top:10px}
.m-shop summary{cursor:pointer;font-weight:600;display:flex;justify-content:space-between;gap:8px}
.m-count{color:var(--muted);font-variant-numeric:tabular-nums}
.m-shop ul{margin:8px 0 2px;padding-left:20px;display:flex;flex-direction:column;gap:2px;overflow-wrap:anywhere}
.m-msg{display:flex;align-items:center;gap:8px;flex-wrap:wrap}

/* search and move dialogs */
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.gs-out{display:flex;flex-direction:column;gap:12px}
.gs-group{display:flex;flex-direction:column;gap:2px}
.gs-group h3{margin:0 0 4px;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.gs-row{width:100%;text-align:left;background:none;border:0;border-radius:10px;padding:9px 10px;display:flex;flex-direction:column;gap:2px;cursor:pointer;min-width:0}
.gs-row:hover{background:var(--surface-2)}
.gs-main{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gs-main.done{text-decoration:line-through;color:var(--muted)}
.gs-sub{font-size:13px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pick-list{display:flex;flex-direction:column;gap:8px}
.pick-list .btn{justify-content:flex-start}

/* sheet */
.backdrop{position:fixed;inset:0;background:rgba(10,16,22,.55);display:flex;align-items:center;justify-content:center;z-index:50;
  padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.sheet{width:min(520px,100%);max-height:100%;overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);padding:20px;display:flex;flex-direction:column;gap:14px}
.sheet h2{font:700 18px/1.2 var(--font-display);margin:0}
.sheet form{display:flex;flex-direction:column;gap:14px}
.sheet .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.sheet .row .spacer{flex:1}
.sheet .note{font-size:13px;color:var(--muted);margin:0;overflow-wrap:anywhere}
.err{color:var(--danger);font-size:13px;min-height:0}
.quad-pick{display:grid;grid-template-columns:1fr 1fr;gap:8px;border:0;padding:0;margin:0;min-width:0}
.quad-pick legend{font-size:13px;font-weight:600;color:var(--muted);padding:0;margin-bottom:6px}
.qp{position:relative;display:block}
.qp input{position:absolute;opacity:0;inset:0;width:100%;height:100%;margin:0;cursor:pointer}
.qp span{display:flex;flex-direction:column;gap:1px;border:1px solid var(--line);border-radius:10px;padding:9px 11px;background:var(--surface-2)}
.qp b{font-size:14px}
.qp small{color:var(--muted);font-size:12px}
.qp input:checked + span{border-color:var(--c);background:var(--s);box-shadow:inset 0 0 0 1px var(--c)}
.qp input:focus-visible + span{outline:2px solid var(--accent);outline-offset:2px}
.qp[data-q="today"]{--c:var(--accent);--s:var(--accent-soft);grid-column:1/-1}
.qp[data-q="do"]{--c:var(--q-do);--s:var(--q-do-soft)}
.qp[data-q="schedule"]{--c:var(--q-sch);--s:var(--q-sch-soft)}
.qp[data-q="delegate"]{--c:var(--q-del);--s:var(--q-del-soft)}
.qp[data-q="eliminate"]{--c:var(--q-no);--s:var(--q-no-soft)}
/* larger text on phones */
@media(max-width:820px){
  body{font-size:17px}
  .top{gap:8px}
  .tabs button{font-size:15px;padding:7px 4px}
  .btn.small{font-size:15px;padding:8px 12px}
  .q-head h2,.pane-head h2,.s-head h2{font-size:19px}
  .q-hint,.f-count,.n-folder,.ed-meta,.s-count{font-size:14px}
  .t-desc,.n-sub,.empty,.sheet .note,.err,label.f,.qp small,.board-foot,.chip,.gs-sub{font-size:15px}
  .t-title,.n-title{font-size:17px}
  .note-item{padding:13px 10px}
  #note-body{font-size:18px}
  .check{width:36px;height:36px}
  .avatar{width:34px;height:34px}
  input,textarea,select{font-size:17px}
}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>

<div class="app">
  <header class="top">
    <div class="sync" id="sync" data-s="wait" role="status">Connecting…</div>
    <button type="button" id="gsearch" class="icon-btn" aria-label="Search tasks, notes and shopping"></button>
    <button type="button" id="acct" class="icon-btn" aria-label="Sign in to sync across devices" hidden></button>
    <nav class="tabs" role="tablist" aria-label="Sections">

/* ---------- persistence ---------- */
function persist(id){
  if(mode==="local"){
    try{localStorage.setItem(LS_ITEMS,JSON.stringify(Object.fromEntries(items)));}catch(e){}

  if(mode!=="db"||!currentUser) return Promise.resolve();

async function writeOne(id){
  pending.set(id,(pending.get(id)||0)+1);
  inflight++; updateSync();
  try{
    var result;
    if(items.has(id)){
      var row={id:id,user_id:currentUser.id,data:items.get(id),updated_at:new Date().toISOString()};
      result=await supabase.from("focus_items").upsert(row,{onConflict:"user_id,id"});
    }else{
      result=await supabase.from("focus_items").delete().eq("user_id",currentUser.id).eq("id",id);
    }
    if(result.error) throw result.error;
    if(writeError){writeError=null;hideBanner("write");}
  }catch(e){
    writeError=e; showBanner("Could not save to your cloud account: "+(e.message||"Please try again."),"write");
  }finally{
    var c=(pending.get(id)||1)-1;
    if(c) pending.set(id,c); else pending.delete(id);
    inflight--; updateSync();
  }
}

async function startDb(user){
  if(mode==="db"&&currentUser&&currentUser.id===user.id) return;
  currentUser=user; mode="db"; loaded=false; confirmed=false; writeError=null;
  renderAcct();
  setSync("wait");
  var result=await supabase.from("focus_items").select("id,data").eq("user_id",user.id);
  if(result.error){
    mode="local";
    showBanner("Cloud connection error: "+result.error.message,"conn");
    setSync("err"); applyReady(); return;
  }
  var next=new Map();
  (result.data||[]).forEach(function(row){
    if(row.data&&typeof row.data==="object"&&row.data.kind) next.set(row.id,row.data);
  });
  // Bring across items previously saved in this browser, without overwriting cloud copies.
  try{
    var raw=localStorage.getItem(LS_ITEMS), localItems=raw?JSON.parse(raw):{};
    var imports=[];
    Object.keys(localItems||{}).forEach(function(id){
      if(!next.has(id)&&localItems[id]&&localItems[id].kind){
        next.set(id,localItems[id]);
        imports.push({id:id,user_id:user.id,data:localItems[id],updated_at:new Date().toISOString()});
      }
    });
    if(imports.length){
      var imported=await supabase.from("focus_items").upsert(imports,{onConflict:"user_id,id"});
      if(imported.error) showBanner("Your cloud data loaded, but some device-only items could not be imported: "+imported.error.message,"write");
    }
  }catch(e){}
  items=next; loaded=true; confirmed=true; hasPending=false;
  hideBanner("conn"); fixUi(); applyReady(); renderAll(); updateSync(); afterReady();
  if(realtimeChannel) await supabase.removeChannel(realtimeChannel);
  realtimeChannel=supabase.channel("focus-items-"+user.id)
    .on("postgres_changes",{event:"*",schema:"public",table:"focus_items",filter:"user_id=eq."+user.id},function(payload){
      var row=payload.new;
      if(payload.eventType==="DELETE"){
        var old=payload.old||{};
        if(old.id&&!pending.has(old.id)&&!timers.has(old.id)) items.delete(old.id);
      }else if(row&&row.id&&row.data&&!pending.has(row.id)&&!timers.has(row.id)){
        items.set(row.id,row.data);
      }
      fixUi(); renderAll(); updateSync();
    }).subscribe(function(status){
      if(status==="SUBSCRIBED"){confirmed=true;updateSync();}
      if(status==="CHANNEL_ERROR"||status==="TIMED_OUT"){
        showBanner("Cloud saving works, but live updates between devices are unavailable. Refresh to load the latest changes.","conn");
      }
    });
}

  else if(ui.folder!=="all") list=list.filter(function(n){return n.folderId===ui.folder;});
  return list.sort(function(a,b){return ((b.pinned?1:0)-(a.pinned?1:0))||(b.updatedAt-a.updatedAt);});
}
function noteTitle(n){
  var lines=n.body.split("\n");
  for(var i=0;i<lines.length;i++){var t=lines[i].trim();if(t) return t;}
  return "New note";
}
function notePreview(n){
  var lines=n.body.split("\n"), seen=false, out=[];
  for(var i=0;i<lines.length;i++){
    var t=lines[i].trim();
    if(!t) continue;
    if(!seen){seen=true;continue;}
    out.push(t);
    if(out.join(" ").length>90) break;
  }
  return out.join(" ").slice(0,110)||"No additional text";
}
function fmtShort(ts){
  var d=new Date(ts), now=new Date();
  if(d.toDateString()===now.toDateString()) return d.toLocaleTimeString([],{hour:"2-digit",minute:"2-digit"});
  if((now-d)/864e5<7) return d.toLocaleDateString([],{weekday:"long"});
  return d.toLocaleDateString([],{day:"numeric",month:"short",year:d.getFullYear()===now.getFullYear()?undefined:"numeric"});
}
function fmtFull(ts){
  return new Date(ts).toLocaleString([],{day:"numeric",month:"short",year:"numeric",hour:"2-digit",minute:"2-digit"});
}

/* ---------- two-step confirm ---------- */
function armBtn(btn,label,confirmLabel,action){
  var t=null;
  btn.textContent=label;
  btn.addEventListener("click",function(){
    if(btn.classList.contains("armed")){
      clearTimeout(t); btn.classList.remove("armed"); btn.textContent=label; action();
    }else{
      btn.classList.add("armed"); btn.textContent=confirmLabel;
      t=setTimeout(function(){btn.classList.remove("armed");btn.textContent=label;},3500);
    }
  });
}

function addFolder(name,keywords){
  var id=newId("f");
  items.set(id,{kind:"folder",name:name,keywords:keywords||"",createdAt:Date.now()});
  persist(id); return id;
}
/* Auto-sort: an unfiled note moves to the folder whose words it matches most.
   Words match at the start of a word, so "cook" also catches "cooking". A folder you pick by hand is never changed. */
function kwList(f){return String(f.keywords||"").split(",").map(function(s){return s.trim().toLowerCase();}).filter(Boolean);}
function escRe(s){return s.replace(/[.*+?^${}()|[\]\\]/g,"\\$&");}
function bestFolder(body){
  var best=null, bestScore=0;
  allFolders().forEach(function(f){
    var score=0;
    kwList(items.get(f.id)).forEach(function(k){
      if(new RegExp("(^|[^\\p{L}\\p{N}])"+escRe(k),"iu").test(body)) score++;
    });
    if(score>bestScore){best=f.id;bestScore=score;}
  });
  return best;
}
function autoFile(id){
  var n=items.get(id);
  if(!n||n.kind!=="note"||n.manual||folderOk(n.folderId)) return false;
  var fid=bestFolder(String(n.body||""));
  if(!fid) return false;
  items.set(id,Object.assign({},n,{folderId:fid,autoFiled:true}));
  persist(id); return true;
}
function sortUnfiled(){
  allNotes().forEach(function(n){if(n.body.trim()) autoFile(n.id);});
}
function deleteFolder(id){
  items.forEach(function(v,nid){
    if(v.kind==="note"&&v.folderId===id){items.set(nid,Object.assign({},v,{folderId:null}));persist(nid);}
  });
  items.delete(id); persist(id);
  if(ui.folder===id) ui.folder="all";
}

      el("button",{class:"check",type:"button","aria-label":(d.done?"Mark not bought: ":"Mark bought: ")+d.text,"aria-pressed":String(!!d.done),onclick:function(){toggleShopItem(d.id);}}),
      el("button",{class:"s-text",type:"button",text:d.text,onclick:function(){openShopItemSheet(d.id);}})));
  });
  var done=list.filter(function(d){return d.done;}).length;
  $("#shop-stats").textContent=list.length?((list.length-done)+" to buy, "+done+" bought"):"";
  $("#shop-clear").hidden=!done;
}

/* ---------- search across tasks, notes and shopping ---------- */
function openSearch(){
  openSheet(function(box){
    var inp=el("input",{id:"gs-input",type:"search",placeholder:"Search tasks, notes and shopping",autocomplete:"off","aria-label":"Search everything"});
    var out=el("div",{class:"gs-out"});
    function group(title,rows){
      if(!rows.length) return;
      out.append(el("div",{class:"gs-group"},el("h3",{text:title}),rows));
    }
    function row(main,sub,done,go){
      return el("button",{class:"gs-row",type:"button",onclick:function(){closeSheet();go();}},
        el("span",{class:"gs-main"+(done?" done":""),text:main}),
        sub?el("span",{class:"gs-sub",text:sub}):null);
    }
    function draw(){
      var q=inp.value.trim().toLowerCase(); out.textContent="";
      if(!q){out.append(el("p",{class:"note",text:"Type to search your tasks, notes and shopping lists."}));return;}
      var quadName={}; QUADS.forEach(function(x){quadName[x.id]=x.name;});
      var tasks=allTasks().filter(function(t){return (t.title+" "+t.desc).toLowerCase().indexOf(q)>=0;}).slice(0,8);
      var notes=allNotes().filter(function(n){return n.body.toLowerCase().indexOf(q)>=0;})
        .sort(function(a,b){return b.updatedAt-a.updatedAt;}).slice(0,8);
      var buys=[];
      items.forEach(function(v,id){
        if(v.kind==="shopitem"&&String(v.text||"").toLowerCase().indexOf(q)>=0) buys.push(Object.assign({},v,{id:id}));
      });
      buys=buys.slice(0,8);
      group("Tasks",tasks.map(function(t){
        return row(t.title,quadName[t.q]+(t.done?" · done":""),t.done,function(){setView("board");openTask(t.id);});
      }));
      group("Notes",notes.map(function(n){
        var fo=folderOk(n.folderId)?items.get(n.folderId).name:"Unfiled";
        return row(noteTitle(n),fo+" · "+fmtShort(n.updatedAt),false,function(){
          setView("notes"); ui.folder="all"; ui.query=""; $("#search").value="";
          selectNote(n.id); renderFolders();
        });
      }));
      group("Shopping",buys.map(function(b){
        var l=items.get(b.listId);
        return row(b.text,(l?l.name:"List")+(b.done?" · bought":""),b.done,function(){
          ui.shopList=b.listId; setView("shop"); renderShop();
        });
      }));
      if(!tasks.length&&!notes.length&&!buys.length) out.append(el("p",{class:"note",text:"No matches."}));
    }
    inp.addEventListener("input",draw);
    box.append(el("h2",{id:"sheet-title",class:"sr",text:"Search"}),inp,out);
    draw();
    setTimeout(function(){inp.focus();},0);
  });
}
$("#gsearch").append(icon("search",20));
$("#gsearch").addEventListener("click",openSearch);

/* ---------- meal planner (reads the Apps Script web app) ---------- */
var LS_MEALS="focus-board-meals-v1";
var mealsState={data:null,error:"",loading:false,at:0,note:""};
try{var cachedMeals=localStorage.getItem(LS_MEALS); if(cachedMeals) mealsState.data=JSON.parse(cachedMeals);}catch(e){}
function afterReady(){
  runAction();
  if(ui.view==="meals") maybeLoadMeals();
}
function plannerUrl(){
  var s=items.get("set-planner");
  return s&&s.kind==="setting"?String(s.url||""):"";
}
function savePlannerUrl(v){
  if(v) items.set("set-planner",{kind:"setting",name:"planner",url:v});
  else items.delete("set-planner");
  persist("set-planner");
  mealsState.at=0; mealsState.error=""; mealsState.note="";
  renderMeals();
  if(v) loadMeals();
}
function openPlannerSheet(){
  openSheet(function(box){
    var url=el("input",{id:"pl-url",type:"text",autocomplete:"off",autocapitalize:"off",placeholder:"https://script.google.com/macros/s/…/exec?token=…"});
    url.value=plannerUrl();
    var err=el("div",{class:"err",role:"alert"});
    var row=el("div",{class:"row"});
    if(plannerUrl()){
      var del=el("button",{class:"btn danger",type:"button"});
      armBtn(del,"Disconnect","Tap again to disconnect",function(){savePlannerUrl("");closeSheet();});
      row.append(del);
    }
    row.append(el("span",{class:"spacer"}),
      el("button",{class:"btn",type:"button",text:"Cancel",onclick:closeSheet}),
      el("button",{class:"btn primary",type:"submit",text:"Save"}));
    var form=el("form",{onsubmit:function(e){
      e.preventDefault();
      var v=url.value.trim();
      if(!/^https:\/\//i.test(v)){err.textContent="Paste the full link, starting with https://";return;}
      savePlannerUrl(v); closeSheet();
    }},
      el("label",{class:"f"},"Meal planner link",url),
      el("p",{class:"note",text:"The web app link from your meal planner script, ending in ?token= and your token."}),
      err,row);
    box.append(el("h2",{id:"sheet-title",text:"Meal planner link"}),form);
  });
}
async function loadMeals() {
  var url = plannerUrl();

  if (!url || mealsState.loading) return;

  mealsState.loading = true;
  mealsState.error = "";
  mealsState.note = "";
  renderMeals();

  var callbackName = "focusBoardMealCallback_" + Date.now();
  var script = document.createElement("script");
  var finished = false;
  var timeout;

  function cleanup() {
    if (timeout) clearTimeout(timeout);
    script.remove();

    try {
      delete window[callbackName];
    } catch (e) {
      window[callbackName] = undefined;
    }
  }

  function finishWithError(message) {
    if (finished) return;
    finished = true;
    cleanup();

    mealsState.error = message;
    mealsState.loading = false;
    renderMeals();
  }

  window[callbackName] = function(data) {
    if (finished) return;
    finished = true;
    cleanup();

    if (data && data.error) {
      mealsState.error = data.error;
    } else if (!data || !Array.isArray(data.meals) || !Array.isArray(data.shops)) {
      mealsState.error = "The meal planner returned an unexpected response.";
    } else {
      mealsState.data = data;
      mealsState.at = Date.now();

      try {
        localStorage.setItem(LS_MEALS, JSON.stringify(data));
      } catch (e) {}
    }

    mealsState.loading = false;
    renderMeals();
  };

  try {
    var requestUrl = new URL(url);
    requestUrl.searchParams.set("callback", callbackName);

    script.src = requestUrl.toString();

    script.onerror = function() {
      finishWithError("Could not connect to the meal planner. Please check the web app link and deployment.");
    };

    timeout = setTimeout(function() {
      finishWithError("The meal planner took too long to respond. Please try again.");
    }, 15000);

    document.head.appendChild(script);

  } catch (e) {
    finishWithError("Could not load the meal plan. " + (e.message || "Please check the link."));
  }
}
function maybeLoadMeals(){
  if(plannerUrl()&&!mealsState.loading&&Date.now()-mealsState.at>300000) loadMeals();
}
function sendToShopping(){
  var d=mealsState.data;
  if(!d||!d.shops||!d.shops.length) return;
  d.shops.forEach(function(s){
    var existing=allShopLists().filter(function(l){return l.name.toLowerCase()===String(s.shop).toLowerCase();})[0];
    var lid=existing?existing.id:addShopList(String(s.shop));
    // replace the planner's earlier items, keep ticks and anything you added yourself
    var prevDone={};
    items.forEach(function(v,id){
      if(v.kind==="shopitem"&&v.listId===lid&&v.source==="planner"){
        prevDone[v.text]=!!v.done; items.delete(id); persist(id);
      }
    });
    var now=Date.now();
    s.items.forEach(function(text,i){
      var id=newId("b");
      items.set(id,{kind:"shopitem",listId:lid,text:String(text),done:!!prevDone[text],source:"planner",createdAt:now+i,updatedAt:now});
      persist(id);
    });
  });
  mealsState.note="Sent "+d.shops.length+" lists to Shop.";
  renderShop(); renderMeals();
}
function renderMeals(){
  var body=$("#meals-body"); body.textContent="";
  if(!plannerUrl()){
    body.append(el("div",{class:"m-card"},
      el("h2",{class:"m-title",text:"Meal planner"}),
      el("p",{class:"m-note",text:"Connect your Google Sheets meal planner to see this week's dishes here and send the grocery list to your Shop tab."}),
      el("div",{},el("button",{class:"btn primary",type:"button",text:"Add planner link",onclick:openPlannerSheet}))));
    return;
  }
  var d=mealsState.data;
  body.append(el("div",{class:"m-head"},
    el("h2",{text:d&&d.week?"Week of "+d.week:"This week"}),
    el("button",{class:"btn small",type:"button",text:mealsState.loading?"Loading…":"Refresh",disabled:mealsState.loading?true:null,onclick:loadMeals}),
    el("button",{class:"icon-btn",type:"button","aria-label":"Planner link settings",onclick:openPlannerSheet},icon("pencil",18))));
  if(mealsState.error) body.append(el("div",{class:"banner",role:"alert",text:mealsState.error}));
  if(!d){
    if(!mealsState.loading&&!mealsState.error) body.append(el("p",{class:"m-note",text:"Nothing loaded yet."}));
    return;
  }
  if(!d.meals||!d.meals.length){
    body.append(el("div",{class:"m-card"},el("p",{class:"m-note",text:"No plan found yet. Plan a week in the sheet first."})));
    return;
  }
  var ul=el("ul",{class:"m-meals"});
  d.meals.forEach(function(m){
    var safe=/^https?:\/\//i.test(m.link||"");
    ul.append(el("li",{class:"m-meal"},
      el("div",{class:"m-info"},
        el("span",{class:"m-cat",text:m.category||""}),
        el("span",{class:"m-name",text:m.name||""}),
        el("span",{class:"m-sub",text:m.portions?m.portions+" portions":""})),
      safe?el("a",{class:"btn small",href:m.link,target:"_blank",rel:"noopener noreferrer",text:"Open recipe"}):null));
  });
  body.append(el("div",{class:"m-card"},ul));
  if(d.shops&&d.shops.length){
    var card=el("div",{class:"m-card"});
    card.append(el("div",{class:"m-head"},
      el("h2",{text:"Grocery list"}),
      el("button",{class:"btn primary small",type:"button",text:"Send to Shop",onclick:sendToShopping})));
    if(mealsState.note){
      card.append(el("div",{class:"m-msg"},mealsState.note,
        el("button",{class:"chip",type:"button",text:"Open Shop",onclick:function(){setView("shop");}})));
    }
    d.shops.forEach(function(s){
      card.append(el("details",{class:"m-shop"},
        el("summary",{},el("span",{text:s.shop}),el("span",{class:"m-count",text:String(s.items.length)})),
        el("ul",{},s.items.map(function(t){return el("li",{text:t});}))));
    });
    body.append(card);
  }
}

/* ---------- view switching ---------- */
function setView(v,opts){
  if(ui.view==="notes"&&v!=="notes"&&ui.noteId){dropIfEmpty(ui.noteId);renderAll();}
  ui.view=v;
  $("#view-board").hidden=v!=="board";
  $("#view-notes").hidden=v!=="notes";
  $("#view-shop").hidden=v!=="shop";
  $("#view-meals").hidden=v!=="meals";
  if(v==="meals") maybeLoadMeals();
  [].forEach.call(document.querySelectorAll(".tabs button"),function(b){b.setAttribute("aria-selected",String(b.dataset.view===v));});
  if(!opts||opts.updateHash!==false){try{if(location.hash!=="#"+v) location.hash=v;}catch(e){}}
  try{localStorage.setItem(LS_VIEW,v);}catch(e){}
}

/* ---------- wiring ---------- */
[].forEach.call(document.querySelectorAll(".tabs button"),function(b){
  b.addEventListener("click",function(){setView(b.dataset.view);});
});
window.addEventListener("hashchange",function(){
  var v=location.hash.slice(1);
  if(v==="board"||v==="notes"||v==="shop"||v==="meals") setView(v,{updateHash:false});
  else if(v==="new-note"||v==="new-task"){ui.action=v;runAction();}
});

QUADS.forEach(function(q){qsel.append(el("option",{value:q.id,text:q.name}));});
qsel.addEventListener("change",function(){ui.lastQuad=qsel.value;});
$("#quick-add").addEventListener("submit",function(e){

var cd=$("#clear-done");
(function(){
  var t=null;
  cd.addEventListener("click",function(){
    if(cd.classList.contains("armed")){
      clearTimeout(t); cd.classList.remove("armed");
      allTasks().forEach(function(x){if(x.done){items.delete(x.id);persist(x.id);}});

      cd.classList.add("armed"); cd.textContent="Tap again to clear";
      t=setTimeout(function(){cd.classList.remove("armed");cd.textContent=cd.dataset.label||"Clear completed";},3500);
    }
  });
})();

armBtn($("#del-note"),"Delete","Tap again to delete",function(){

init();
