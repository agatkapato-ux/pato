<style>
/* Layout: slim top bar (title, sync dot, small account button, Board / Notes switch).
   Board is a 2x2 priority matrix. Notes open on the recent-notes list; on phones the list has
   a bottom bar with New note and Folders, and folders / editor are separate full-screen panes. */
:root{
  --bg:#e6d6e0; --surface:#ffffff; --surface-2:#f6eff3; --ink:#18212a; --muted:#6a5c66; --line:#d9c5d2;
  --accent:#8a3f6e; --accent-ink:#ffffff; --accent-soft:#f0dde8;
  --q-do:#b8422f; --q-do-soft:#f8e1dc;
  --q-sch:#2a64ad; --q-sch-soft:#dbe7f6;
  --q-del:#946110; --q-del-soft:#f5e9d0;
  --q-no:#5d6874; --q-no-soft:#e5e8ec;
  --danger:#b8422f; --danger-ink:#ffffff;
  --ok:#2f9e63; --warn:#c98a1b;
  --shadow:0 1px 2px rgba(20,30,40,.06),0 8px 24px rgba(20,30,40,.08);
  --font-display:"Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",sans-serif;
  --font-body:"Instrument Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --radius:14px;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#241a22; --surface:#2e222c; --surface-2:#382b36; --ink:#e7ecf1; --muted:#aa9aa5; --line:#493945;
    --accent:#d08ab5; --accent-ink:#2a0f20; --accent-soft:#3a1f30;
    --q-do:#ef8a78; --q-do-soft:#3a201b;
    --q-sch:#7fb0ee; --q-sch-soft:#1b2b40;
    --q-del:#e0ae5c; --q-del-soft:#3a2d15;
    --q-no:#a2adb9; --q-no-soft:#242c35;
    --danger:#ef8a78; --danger-ink:#2a0d08;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#241a22; --surface:#2e222c; --surface-2:#382b36; --ink:#e7ecf1; --muted:#aa9aa5; --line:#493945;
  --accent:#d08ab5; --accent-ink:#2a0f20; --accent-soft:#3a1f30;
  --q-do:#ef8a78; --q-do-soft:#3a201b;
  --q-sch:#7fb0ee; --q-sch-soft:#1b2b40;
  --q-del:#e0ae5c; --q-del-soft:#3a2d15;
  --q-no:#a2adb9; --q-no-soft:#242c35;
  --danger:#ef8a78; --danger-ink:#2a0d08;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35);
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font:15px/1.45 var(--font-body);
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  overflow:hidden;
}
button{font:inherit;color:inherit}
[hidden]{display:none!important}
.ico{display:inline-flex;flex:none}
.ico svg{display:block}

.app{height:100%;min-height:520px;max-width:1280px;margin:0 auto;display:flex;flex-direction:column;gap:12px;padding-block:12px}

/* top bar */
.top{display:flex;align-items:center;gap:10px 12px;flex-wrap:wrap;flex:none}
.tabs{order:-1;flex:1 1 200px;min-width:0;max-width:420px;display:inline-flex;background:var(--surface-2);border:1px solid var(--line);border-radius:999px;padding:3px}
.tabs button{flex:1;min-width:0;white-space:nowrap;border:0;background:none;padding:7px 10px;border-radius:999px;font-weight:600;color:var(--muted);cursor:pointer}
.tabs button[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(20,30,40,.12)}
.sync{margin-left:auto;display:flex;align-items:center;padding:6px}
.sync::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--muted)}
.sync[data-s="ok"]::before{background:var(--ok)}
.sync[data-s="busy"]::before,.sync[data-s="local"]::before{background:var(--warn)}
.sync[data-s="err"]::before{background:var(--danger)}
.avatar{width:30px;height:30px;border-radius:50%;border:1px solid var(--line);background:var(--accent-soft);color:var(--accent);font-weight:700;font-size:13px;display:inline-grid;place-items:center;cursor:pointer;padding:0;flex:none}
.avatar:hover{border-color:var(--accent)}
.banner{flex:none;background:var(--q-del-soft);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:9px 12px;font-size:13px}
.view{flex:1;min-height:0}

/* buttons and fields */
.btn{font-weight:600;border-radius:10px;padding:9px 14px;border:1px solid var(--line);background:var(--surface);cursor:pointer;display:inline-flex;align-items:center;gap:6px;justify-content:center}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.btn.primary:hover{filter:brightness(1.1)}
.btn.small{padding:6px 10px;font-size:13px}
.btn.danger{color:var(--danger)}
.btn.danger.armed{background:var(--danger);color:var(--danger-ink);border-color:transparent}
.btn[disabled],button[disabled]{opacity:.5;cursor:not-allowed}
.icon-btn{border:0;background:none;width:34px;height:34px;border-radius:8px;display:inline-grid;place-items:center;color:var(--muted);cursor:pointer;flex:none}
.icon-btn:hover{background:var(--surface-2);color:var(--ink)}
:is(button,input,textarea,select):focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input,textarea,select{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%;min-width:0}
textarea{resize:vertical}
label.f{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:600;color:var(--muted)}
@media(max-width:820px){input,textarea,select{font-size:16px}}

/* board */
.board{display:flex;flex-direction:column;gap:12px;overflow-y:auto;padding-bottom:4px}
.quick{display:flex;gap:8px;flex:none}
.quick input{flex:1}
.quick select{width:auto;flex:none}
@media(max-width:560px){.quick{flex-wrap:wrap}.quick input{flex-basis:100%}.quick select{flex:1}}
.matrix{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));grid-template-rows:minmax(110px,auto);grid-auto-rows:minmax(200px,1fr);gap:12px;flex:1 0 auto}

/* ---------- state ---------- */
var items=new Map();          // id -> {kind, ...}
var ui={view:"board",folder:"all",noteId:null,pane:"list",query:"",lastQuad:"do",shopList:null,action:null};
var mode="connecting";        // connecting | db | local
var loaded=false, confirmed=false, hasPending=false;
var inflight=0, writeError=null, bannerKind=null;
var pending=new Map(), timers=new Map();

/* ---------- sync status ---------- */
function setSync(k){
  var s=$("#sync");
  s.dataset.s=k;
  var label=({ok:"Synced",busy:"Saving…",wait:"Connecting…",local:"This device only",err:"Not saved"})[k];
  s.title=label; s.setAttribute("aria-label",label);
}
function updateSync(){
  if(mode==="local") return setSync("local");
  if(writeError) return setSync("err");
  if(inflight>0||timers.size>0||hasPending) return setSync("busy");
  return setSync(confirmed?"ok":"wait");
}
function showBanner(text,kind){bannerKind=kind||null;var b=$("#banner");b.textContent=text;b.hidden=false;}
function hideBanner(kind){if(kind&&bannerKind!==kind) return;bannerKind=null;$("#banner").hidden=true;}

/* ---------- persistence ---------- */
function persist(id){
  if(mode==="local"){
    try{localStorage.setItem(LS_ITEMS,JSON.stringify(Object.fromEntries(items)));}catch(e){}
    return Promise.resolve();
  }
  if(mode!=="db"||!currentUser) return Promise.resolve();
  return writeOne(id);
}
async function writeOne(id){
  pending.set(id,(pending.get(id)||0)+1);
  inflight++; updateSync();
  try{
    var result;
    if(items.has(id)){
      var row={id:id,user_id:currentUser.id,data:items.get(id),updated_at:new Date().toISOString()};
      result=await supabase.from("focus_items").upsert(row,{onConflict:"user_id,id"});
    }else{
      result=await supabase.from("focus_items").delete().eq("user_id",currentUser.id).eq("id",id);
    }
    if(result.error) throw result.error;
    if(writeError){writeError=null;hideBanner("write");}
  }catch(e){
    writeError=e; showBanner("Could not save to your cloud account: "+(e.message||"Please try again."),"write");
  }finally{
    var c=(pending.get(id)||1)-1;
    if(c) pending.set(id,c); else pending.delete(id);
    inflight--; updateSync();
  }
}
function scheduleNote(id){
  clearTimeout(timers.get(id));
  timers.set(id,setTimeout(function(){flushNote(id);},600));
  updateSync();
}
function flushNote(id){
  var t=timers.get(id);
  if(t){clearTimeout(t);timers.delete(id);}
  persist(id);
}
function flushAll(){Array.from(timers.keys()).forEach(flushNote);}

/* ---------- account (small button in the top bar, details in a dialog) ---------- */
function renderAcct(){
  var b=$("#acct");
  b.hidden=false;

}
function buildAccount(box,message,isError){
  box.textContent="";
  if(currentUser){
    var out=el("button",{class:"btn danger",type:"button",text:"Sign out",onclick:async function(){
      flushAll();

      closeSheet(); showSignedOut();
    }});
    var note=el("p",{class:"err",role:"alert"});
    box.append(
      el("h2",{id:"sheet-title",text:"Account"}),
      el("p",{class:"note",text:"Signed in as "+(currentUser.email||"your account")+". Your tasks and notes sync across your devices."}),
      note,
      el("div",{class:"row"},el("span",{class:"spacer"}),
        el("button",{class:"btn",type:"button",text:"Close",onclick:closeSheet}),out));
    return;
  }

  var msg=el("div",{class:isError?"err":"note",role:"status",text:message||""});
  var submit=el("button",{class:"btn primary",type:"submit",text:signup?"Create account":"Sign in"});
  var form=el("form",{onsubmit:async function(e){
    e.preventDefault();

    submit.disabled=true; msg.className="note"; msg.textContent=signup?"Creating your account…":"Signing in…";
    try{
      if(signup){
        var created=await supabase.auth.signUp({email:email.value.trim(),password:pass.value});
        if(created.error) throw created.error;
        if(created.data.session){closeSheet();}
        else{authMode="signin";buildAccount(box,"Account created. Check your email for a confirmation link, then sign in.");}
      }else{
        var signed=await supabase.auth.signInWithPassword({email:email.value.trim(),password:pass.value});
        if(signed.error) throw signed.error;
        closeSheet();
      }
    }catch(err){
      msg.className="err"; msg.textContent=err.message||"Sign-in failed.";
      submit.disabled=false;
    }
  }},
    el("label",{class:"f"},"Email",email),
    el("label",{class:"f"},"Password",pass),

}

function showSignedOut(){
  currentUser=null; mode="local"; loaded=true; confirmed=false; hasPending=false;
  if(realtimeChannel&&supabase){supabase.removeChannel(realtimeChannel);realtimeChannel=null;}
  setSync("local");
  try{
    var raw=localStorage.getItem(LS_ITEMS);
    items=raw?new Map(Object.entries(JSON.parse(raw))):new Map();
  }catch(e){items=new Map();}
  hideBanner("conn");
  renderAcct(); fixUi(); applyReady(); renderAll(); afterReady();
}
async function startDb(user){
  if(mode==="db"&&currentUser&&currentUser.id===user.id) return;
  currentUser=user; mode="db"; loaded=false; confirmed=false; writeError=null;
  renderAcct();
  setSync("wait");
  var result=await supabase.from("focus_items").select("id,data").eq("user_id",user.id);
  if(result.error){
    mode="local";
    showBanner("Cloud connection error: "+result.error.message,"conn");
    setSync("err"); applyReady(); return;
  }
  var next=new Map();
  (result.data||[]).forEach(function(row){
    if(row.data&&typeof row.data==="object"&&row.data.kind) next.set(row.id,row.data);
  });
  // Bring across items previously saved in this browser, without overwriting cloud copies.
  try{
    var raw=localStorage.getItem(LS_ITEMS), localItems=raw?JSON.parse(raw):{};
    var imports=[];
    Object.keys(localItems||{}).forEach(function(id){
      if(!next.has(id)&&localItems[id]&&localItems[id].kind){
        next.set(id,localItems[id]);
        imports.push({id:id,user_id:user.id,data:localItems[id],updated_at:new Date().toISOString()});
      }
    });
    if(imports.length){
      var imported=await supabase.from("focus_items").upsert(imports,{onConflict:"user_id,id"});
      if(imported.error) showBanner("Your cloud data loaded, but some device-only items could not be imported: "+imported.error.message,"write");
    }
  }catch(e){}
  items=next; loaded=true; confirmed=true; hasPending=false;
  hideBanner("conn"); fixUi(); applyReady(); renderAll(); updateSync(); afterReady();
  if(realtimeChannel) await supabase.removeChannel(realtimeChannel);
  realtimeChannel=supabase.channel("focus-items-"+user.id)
    .on("postgres_changes",{event:"*",schema:"public",table:"focus_items",filter:"user_id=eq."+user.id},function(payload){
      var row=payload.new;
      if(payload.eventType==="DELETE"){
        var old=payload.old||{};
        if(old.id&&!pending.has(old.id)&&!timers.has(old.id)) items.delete(old.id);
      }else if(row&&row.id&&row.data&&!pending.has(row.id)&&!timers.has(row.id)){
        items.set(row.id,row.data);
      }
      fixUi(); renderAll(); updateSync();
    }).subscribe(function(status){
      if(status==="SUBSCRIBED"){confirmed=true;updateSync();}
      if(status==="CHANNEL_ERROR"||status==="TIMED_OUT"){
        showBanner("Cloud saving works, but live updates between devices are unavailable. Refresh to load the latest changes.","conn");
      }
    });
}
async function init(){
  var v=location.hash.slice(1), saved=null;
  try{saved=localStorage.getItem(LS_VIEW);}catch(e){}
  var views=["board","notes","shop","meals"];
  if(v==="new-note"||v==="new-task") ui.action=v;
  setView(ui.action==="new-note"?"notes":ui.action==="new-task"?"board":views.indexOf(v)>=0?v:(views.indexOf(saved)>=0?saved:"board"),{updateHash:false});
  renderAll();
  if(!window.supabase||!window.supabase.createClient){
    showSignedOut(); showBanner("Could not load the sync library. Check your internet connection. Changes are kept in this browser.","conn"); return;
  }
  supabase=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);
  supabase.auth.onAuthStateChange(function(event,session){
    if(session&&session.user){
      // Defer database work outside the auth callback to avoid locking auth state changes.
      setTimeout(function(){startDb(session.user);},0);
    }else if(event==="SIGNED_OUT"){
      showSignedOut();
    }
  });
  var sessionResult=await supabase.auth.getSession();
  if(sessionResult.error){showSignedOut();showBanner(sessionResult.error.message,"conn");return;}
  if(sessionResult.data.session&&sessionResult.data.session.user){
    await startDb(sessionResult.data.session.user);
  }else{
    showSignedOut();
  }
}

/* ---------- selectors ---------- */
function allTasks(){
  var out=[];
  items.forEach(function(v,id){
    if(v.kind==="task") out.push(Object.assign({},v,{id:id,q:QIDS.indexOf(v.q)>=0?v.q:"do",title:String(v.title||""),desc:String(v.desc||"")}));
  });
  return out;
}
function allFolders(){
  var out=[];
  items.forEach(function(v,id){if(v.kind==="folder") out.push({id:id,name:String(v.name||"Folder"),createdAt:v.createdAt||0});});
  return out.sort(function(a,b){return a.createdAt-b.createdAt;});
}
function allNotes(){
  var out=[];
  items.forEach(function(v,id){
    if(v.kind==="note") out.push(Object.assign({},v,{id:id,body:String(v.body||""),updatedAt:v.updatedAt||0}));
  });
  return out;
}
function folderOk(fid){return !!fid&&items.has(fid)&&items.get(fid).kind==="folder";}
function visibleNotes(){
  var list=allNotes(), q=ui.query.trim().toLowerCase();
  if(q) list=list.filter(function(n){return n.body.toLowerCase().indexOf(q)>=0;});
  else if(ui.folder==="unfiled") list=list.filter(function(n){return !folderOk(n.folderId);});
  else if(ui.folder!=="all") list=list.filter(function(n){return n.folderId===ui.folder;});
  return list.sort(function(a,b){return ((b.pinned?1:0)-(a.pinned?1:0))||(b.updatedAt-a.updatedAt);});
}
function noteTitle(n){
  var lines=n.body.split("\n");
  for(var i=0;i<lines.length;i++){var t=lines[i].trim();if(t) return t;}
  return "New note";
}
function notePreview(n){
  var lines=n.body.split("\n"), seen=false, out=[];
  for(var i=0;i<lines.length;i++){
    var t=lines[i].trim();
    if(!t) continue;
    if(!seen){seen=true;continue;}
    out.push(t);
    if(out.join(" ").length>90) break;
  }
  return out.join(" ").slice(0,110)||"No additional text";
}
function fmtShort(ts){
  var d=new Date(ts), now=new Date();
  if(d.toDateString()===now.toDateString()) return d.toLocaleTimeString([],{hour:"2-digit",minute:"2-digit"});
  if((now-d)/864e5<7) return d.toLocaleDateString([],{weekday:"long"});
  return d.toLocaleDateString([],{day:"numeric",month:"short",year:d.getFullYear()===now.getFullYear()?undefined:"numeric"});
}
function fmtFull(ts){
  return new Date(ts).toLocaleString([],{day:"numeric",month:"short",year:"numeric",hour:"2-digit",minute:"2-digit"});
}
function fixUi(){
  if(ui.noteId&&!(items.has(ui.noteId)&&items.get(ui.noteId).kind==="note")) ui.noteId=null;
  if(ui.folder!=="all"&&ui.folder!=="unfiled"&&!folderOk(ui.folder)) ui.folder="all";
}

/* ---------- two-step confirm ---------- */
function armBtn(btn,label,confirmLabel,action){
  var t=null;
  btn.textContent=label;
  btn.addEventListener("click",function(){
    if(btn.classList.contains("armed")){
      clearTimeout(t); btn.classList.remove("armed"); btn.textContent=label; action();
    }else{
      btn.classList.add("armed"); btn.textContent=confirmLabel;
      t=setTimeout(function(){btn.classList.remove("armed");btn.textContent=label;},3500);
    }
  });
}

/* ---------- board ---------- */
function addTask(title,q){

  items.set(id,{kind:"task",title:title,desc:"",q:q,done:false,createdAt:now,updatedAt:now});

function toggleDone(id){
  var t=items.get(id); if(!t) return;

function moveTask(id,q){

function openTask(id){

  });

function renderBoard(){
  var matrix=$("#matrix"); matrix.textContent="";
  var tasks=allTasks();
  QUADS.forEach(function(q){
    var list=tasks.filter(function(t){return t.q===q.id;})
      .sort(function(a,b){return ((a.done?1:0)-(b.done?1:0))||((a.createdAt||0)-(b.createdAt||0));});
    var open=list.filter(function(t){return !t.done;}).length;
    var ul=el("ul",{class:"tasks"});
    if(!list.length) ul.append(el("li",{class:"empty",text:loaded?"Nothing here yet.":"Loading…"}));
    list.forEach(function(t){
      var li=el("li",{class:"task"+(t.done?" done":""),draggable:"true","data-id":t.id},
        el("button",{class:"check",type:"button","aria-label":(t.done?"Mark not done: ":"Mark done: ")+t.title,"aria-pressed":String(!!t.done),onclick:function(){toggleDone(t.id);}}),
        el("button",{class:"task-main",type:"button",onclick:function(){openTask(t.id);}},
          el("span",{class:"t-title",text:t.title}),
          t.desc?el("span",{class:"t-desc",text:t.desc}):null));
      li.addEventListener("dragstart",function(e){
        e.dataTransfer.setData("text/plain",t.id); e.dataTransfer.effectAllowed="move"; li.classList.add("dragging");
      });
      li.addEventListener("dragend",function(){li.classList.remove("dragging");});
      ul.append(li);
    });
    var sec=el("section",{class:"quad","data-q":q.id,"aria-label":q.name},
      el("div",{class:"q-head"},el("span",{class:"q-dot"}),el("h2",{text:q.name}),el("span",{class:"q-hint",text:q.hint}),el("span",{class:"q-count",text:String(open)})),
      ul);
    sec.addEventListener("dragover",function(e){e.preventDefault();e.dataTransfer.dropEffect="move";sec.classList.add("over");});
    sec.addEventListener("dragleave",function(e){if(!sec.contains(e.relatedTarget)) sec.classList.remove("over");});
    sec.addEventListener("drop",function(e){
      e.preventDefault(); sec.classList.remove("over");
      moveTask(e.dataTransfer.getData("text/plain"),q.id);
    });
    matrix.append(sec);
  });
  var done=tasks.filter(function(t){return t.done;}).length;
  $("#board-stats").textContent=tasks.length?((tasks.length-done)+" open, "+done+" done"):"";
  var cd=$("#clear-done");
  cd.hidden=!done;
  if(done&&!cd.classList.contains("armed")) cd.textContent="Clear completed ("+done+")";
  cd.dataset.label="Clear completed ("+done+")";
}

/* ---------- notes ---------- */
function addFolder(name,keywords){
  var id=newId("f");
  items.set(id,{kind:"folder",name:name,keywords:keywords||"",createdAt:Date.now()});
  persist(id); return id;
}
/* Auto-sort: an unfiled note moves to the folder whose words it matches most.
   Words match at the start of a word, so "cook" also catches "cooking". A folder you pick by hand is never changed. */
function kwList(f){return String(f.keywords||"").split(",").map(function(s){return s.trim().toLowerCase();}).filter(Boolean);}
function escRe(s){return s.replace(/[.*+?^${}()|[\]\\]/g,"\\$&");}
function bestFolder(body){
  var best=null, bestScore=0;
  allFolders().forEach(function(f){
    var score=0;
    kwList(items.get(f.id)).forEach(function(k){
      if(new RegExp("(^|[^\\p{L}\\p{N}])"+escRe(k),"iu").test(body)) score++;
    });
    if(score>bestScore){best=f.id;bestScore=score;}
  });
  return best;
}
function autoFile(id){
  var n=items.get(id);
  if(!n||n.kind!=="note"||n.manual||folderOk(n.folderId)) return false;
  var fid=bestFolder(String(n.body||""));
  if(!fid) return false;
  items.set(id,Object.assign({},n,{folderId:fid,autoFiled:true}));
  persist(id); return true;
}
function sortUnfiled(){
  allNotes().forEach(function(n){if(n.body.trim()) autoFile(n.id);});
}
function deleteFolder(id){
  items.forEach(function(v,nid){
    if(v.kind==="note"&&v.folderId===id){items.set(nid,Object.assign({},v,{folderId:null}));persist(nid);}
  });
  items.delete(id); persist(id);
  if(ui.folder===id) ui.folder="all";
}
function openFolderSheet(id){

  openSheet(function(box){

    name.value=f?f.name:"";
    var kw=el("input",{id:"fs-kw",type:"text",maxlength:"300",placeholder:"For example: recipe, dinner, cook",autocomplete:"off"});
    kw.value=f?(f.keywords||""):"";
    var err=el("div",{class:"err",role:"alert"});
    var row=el("div",{class:"row"});

function dragHandle(d){
  var h=el("button",{class:"drag-h",type:"button","aria-label":"Move "+d.text+" to another shop",title:"Drag to another shop, or tap"},icon("grip",18));
  h.draggable=true;

    e.dataTransfer.effectAllowed="move";
    if(row&&e.dataTransfer.setDragImage) e.dataTransfer.setDragImage(row,20,20);
  });
  h.addEventListener("click",function(){
    if(h.dataset.moved){delete h.dataset.moved;return;}
    openShopMoveSheet(d.id);
  });
  // touch dragging
  var over=null, startX=0, startY=0, moved=false;
  function targetAt(x,y){
    var n=document.elementFromPoint(x,y);
    return n&&n.closest?n.closest("[data-droplist]"):null;
  }
  h.addEventListener("touchstart",function(e){
    var t=e.touches[0]; startX=t.clientX; startY=t.clientY; moved=false;
  },{passive:true});
  h.addEventListener("touchmove",function(e){
    var t=e.touches[0];
    if(!moved&&Math.abs(t.clientX-startX)+Math.abs(t.clientY-startY)<10) return;
    moved=true; h.dataset.moved="1";
    e.preventDefault();
    var n=targetAt(t.clientX,t.clientY);
    if(over&&over!==n) over.classList.remove("dz-over");

      if(moved) moveShopItem(d.id,lid);

    if(!moved) delete h.dataset.moved;
  });
  h.addEventListener("touchcancel",function(){
    if(over) over.classList.remove("dz-over"); over=null;

    function draw(){
      var q=inp.value.trim().toLowerCase(); out.textContent="";
      if(!q){out.append(el("p",{class:"note",text:"Type to search your tasks, notes and shopping lists."}));return;}
      var quadName={}; QUADS.forEach(function(x){quadName[x.id]=x.name;});
      var tasks=allTasks().filter(function(t){return (t.title+" "+t.desc).toLowerCase().indexOf(q)>=0;}).slice(0,8);
      var notes=allNotes().filter(function(n){return n.body.toLowerCase().indexOf(q)>=0;})
        .sort(function(a,b){return b.updatedAt-a.updatedAt;}).slice(0,8);
      var buys=[];
      items.forEach(function(v,id){
        if(v.kind==="shopitem"&&String(v.text||"").toLowerCase().indexOf(q)>=0) buys.push(Object.assign({},v,{id:id}));
      });
      buys=buys.slice(0,8);
      group("Tasks",tasks.map(function(t){
        return row(t.title,quadName[t.q]+(t.done?" · done":""),t.done,function(){setView("board");openTask(t.id);});
      }));
      group("Notes",notes.map(function(n){
        var fo=folderOk(n.folderId)?items.get(n.folderId).name:"Unfiled";
        return row(noteTitle(n),fo+" · "+fmtShort(n.updatedAt),false,function(){
          setView("notes"); ui.folder="all"; ui.query=""; $("#search").value="";
          selectNote(n.id); renderFolders();
        });
      }));
      group("Shopping",buys.map(function(b){
        var l=items.get(b.listId);
        return row(b.text,(l?l.name:"List")+(b.done?" · bought":""),b.done,function(){
          ui.shopList=b.listId; setView("shop"); renderShop();
        });
      }));
      if(!tasks.length&&!notes.length&&!buys.length) out.append(el("p",{class:"note",text:"No matches."}));
    }
    inp.addEventListener("input",draw);
    box.append(el("h2",{id:"sheet-title",class:"sr",text:"Search"}),inp,out);
    draw();
    setTimeout(function(){inp.focus();},0);
  });
}
$("#gsearch").append(icon("search",20));
$("#gsearch").addEventListener("click",openSearch);

/* ---------- meal planner (reads the Apps Script web app) ---------- */
var LS_MEALS="focus-board-meals-v1";
var mealsState={data:null,error:"",loading:false,at:0,note:""};
try{var cachedMeals=localStorage.getItem(LS_MEALS); if(cachedMeals) mealsState.data=JSON.parse(cachedMeals);}catch(e){}
function afterReady(){
  runAction();
  autoImport();
  if(ui.view==="meals") maybeLoadMeals();
}
function plannerUrl(){
  var s=items.get("set-planner");
  return s&&s.kind==="setting"?String(s.url||""):"";
}
function savePlannerUrl(v){
  if(v) items.set("set-planner",{kind:"setting",name:"planner",url:v});
  else items.delete("set-planner");
  persist("set-planner");
  mealsState.at=0; mealsState.error=""; mealsState.note="";
  renderMeals();
  if(v) loadMeals();
}
function openPlannerSheet(){
  openSheet(function(box){
    var url=el("input",{id:"pl-url",type:"text",autocomplete:"off",autocapitalize:"off",placeholder:"https://script.google.com/macros/s/…/exec?token=…"});
    url.value=plannerUrl();
    var err=el("div",{class:"err",role:"alert"});
    var row=el("div",{class:"row"});
    if(plannerUrl()){
      var del=el("button",{class:"btn danger",type:"button"});
      armBtn(del,"Disconnect","Tap again to disconnect",function(){savePlannerUrl("");closeSheet();});
      row.append(del);
    }
    row.append(el("span",{class:"spacer"}),
      el("button",{class:"btn",type:"button",text:"Cancel",onclick:closeSheet}),
      el("button",{class:"btn primary",type:"submit",text:"Save"}));
    var form=el("form",{onsubmit:function(e){
      e.preventDefault();
      var v=url.value.trim();
      if(!/^https:\/\//i.test(v)){err.textContent="Paste the full link, starting with https://";return;}
      savePlannerUrl(v); closeSheet();
    }},
      el("label",{class:"f"},"Meal planner link",url),
      el("p",{class:"note",text:"The web app link from your meal planner script, ending in ?token= and your token."}),
      err,row);
    box.append(el("h2",{id:"sheet-title",text:"Meal planner link"}),form);
  });
}
async function loadMeals(){
  var url=plannerUrl(); if(!url||mealsState.loading) return;
  mealsState.loading=true; mealsState.error=""; mealsState.note=""; renderMeals();
  try{
    var res=await fetch(url,{cache:"no-store"});
    var data=await res.json();
    if(data&&data.error) throw new Error(data.error);
    mealsState.data=data; mealsState.at=Date.now();
    try{localStorage.setItem(LS_MEALS,JSON.stringify(data));}catch(e){}
    autoImport();
  }catch(e){
    mealsState.error="Could not load the meal plan. Check the link, and that the web app is shared with “Anyone”. ("+(e&&e.message?e.message:"network error")+")";
  }
  mealsState.loading=false; renderMeals();
}
function maybeLoadMeals(){
  if(plannerUrl()&&!mealsState.loading&&Date.now()-mealsState.at>300000) loadMeals();
}
/* Import the planner's grocery list into the Shop tab once per week.
   After that the lists are yours to edit; "Reset from planner" brings them back to the sheet's version. */
function autoImport(){
  var d=mealsState.data;
  if(!d||!d.week||!d.shops||!d.shops.length||mode==="connecting"||!loaded) return;
  var s=items.get("set-planner-week");
  if(s&&s.week===d.week) return;
  sendToShopping(true);
}
function sendToShopping(auto){
  var d=mealsState.data;
  if(!d||!d.shops||!d.shops.length) return;
  items.set("set-planner-week",{kind:"setting",name:"planner-week",week:d.week||""});
  persist("set-planner-week");
  d.shops.forEach(function(s){
    var existing=allShopLists().filter(function(l){return l.name.toLowerCase()===String(s.shop).toLowerCase();})[0];
    var lid=existing?existing.id:addShopList(String(s.shop));
    // replace the planner's earlier items, keep ticks and anything you added yourself
    var prevDone={};
    items.forEach(function(v,id){
      if(v.kind==="shopitem"&&v.listId===lid&&v.source==="planner"){
        prevDone[v.text]=!!v.done; items.delete(id); persist(id);
      }
    });
    var now=Date.now();
    s.items.forEach(function(text,i){
      var id=newId("b");
      items.set(id,{kind:"shopitem",listId:lid,text:String(text),done:!!prevDone[text],source:"planner",createdAt:now+i,updatedAt:now});
      persist(id);
    });
  });
  mealsState.note=auto===true?"":"Lists reset from the planner.";
  renderShop(); renderMeals();
}
function renderMeals(){
  var body=$("#meals-body"); body.textContent="";
  if(!plannerUrl()){
    body.append(el("div",{class:"m-card"},
      el("h2",{class:"m-title",text:"Meal planner"}),
      el("p",{class:"m-note",text:"Connect your Google Sheets meal planner to see this week's dishes here and send the grocery list to your Shop tab."}),
      el("div",{},el("button",{class:"btn primary",type:"button",text:"Add planner link",onclick:openPlannerSheet}))));
    return;
  }
  var d=mealsState.data;
  body.append(el("div",{class:"m-head"},
    el("h2",{text:d&&d.week?"Week of "+d.week:"This week"}),
    el("button",{class:"btn small",type:"button",text:mealsState.loading?"Loading…":"Refresh",disabled:mealsState.loading?true:null,onclick:loadMeals}),
    el("button",{class:"icon-btn",type:"button","aria-label":"Planner link settings",onclick:openPlannerSheet},icon("pencil",18))));
  if(mealsState.error) body.append(el("div",{class:"banner",role:"alert",text:mealsState.error}));
  if(!d){
    if(!mealsState.loading&&!mealsState.error) body.append(el("p",{class:"m-note",text:"Nothing loaded yet."}));
    return;
  }
  if(!d.meals||!d.meals.length){
    body.append(el("div",{class:"m-card"},el("p",{class:"m-note",text:"No plan found yet. Plan a week in the sheet first."})));
    return;
  }
  var ul=el("ul",{class:"m-meals"});
  d.meals.forEach(function(m){
    var safe=/^https?:\/\//i.test(m.link||"");
    ul.append(el("li",{class:"m-meal"},
      el("div",{class:"m-info"},
        el("span",{class:"m-cat",text:m.category||""}),
        el("span",{class:"m-name",text:m.name||""}),
        el("span",{class:"m-sub",text:m.portions?m.portions+" portions":""})),
      safe?el("a",{class:"btn small",href:m.link,target:"_blank",rel:"noopener noreferrer",text:"Open recipe"}):null));
  });
  body.append(el("div",{class:"m-card"},ul));
  if(d.shops&&d.shops.length){
    var card=el("div",{class:"m-card"});
    var reset=el("button",{class:"btn small danger",type:"button"});
    armBtn(reset,"Reset from planner","Tap again to reset",function(){sendToShopping();});
    card.append(el("div",{class:"m-head"},el("h2",{text:"Grocery list"}),reset));
    card.append(el("p",{class:"m-note",text:"Edit, tick or delete items right here. The same lists are on the Shop tab."}));
    if(mealsState.note) card.append(el("div",{class:"m-msg",text:mealsState.note}));
    d.shops.forEach(function(s){
      var l=allShopLists().filter(function(x){return x.name.toLowerCase()===String(s.shop).toLowerCase();})[0];
      var sec=el("section",{class:"m-shop","aria-label":s.shop});
      if(!l){
        sec.append(el("h3",{class:"m-shop-title",text:s.shop}),el("p",{class:"m-note",text:"Loading…"}));
        card.append(sec); return;
      }
      wireDrop(sec,l.id);
      var list=shopItems(l.id), open=list.filter(function(x){return !x.done;}).length;
      sec.append(el("h3",{class:"m-shop-title"},el("span",{text:l.name}),el("span",{class:"m-count",text:open+" to buy"})));
      var ul=el("ul",{class:"s-items"});
      list.forEach(function(x){ul.append(shopRow(x));});
      sec.append(ul);
      var add=el("input",{type:"text",maxlength:"120",placeholder:"Add to "+l.name,"aria-label":"Add to "+l.name,"data-list":l.id});
      var form=el("form",{class:"quick inline",autocomplete:"off"},add,el("button",{class:"btn",type:"submit",text:"Add"}));
      form.addEventListener("submit",function(e){
        e.preventDefault();
        var v=add.value.trim(); if(!v) return;
        addShopItem(l.id,v); renderShop(); renderMeals();
        var nx=document.querySelector('#meals-body input[data-list="'+l.id+'"]'); if(nx) nx.focus();
      });
      sec.append(form);
      card.append(sec);
    });
    body.append(card);
  }
}

/* ---------- view switching ---------- */
function setView(v,opts){
  if(ui.view==="notes"&&v!=="notes"&&ui.noteId){dropIfEmpty(ui.noteId);renderAll();}
  ui.view=v;
  $("#view-board").hidden=v!=="board";
  $("#view-notes").hidden=v!=="notes";
  $("#view-shop").hidden=v!=="shop";
  $("#view-meals").hidden=v!=="meals";
  if(v==="meals") maybeLoadMeals();
  [].forEach.call(document.querySelectorAll(".tabs button"),function(b){b.setAttribute("aria-selected",String(b.dataset.view===v));});
  if(!opts||opts.updateHash!==false){try{if(location.hash!=="#"+v) location.hash=v;}catch(e){}}
  try{localStorage.setItem(LS_VIEW,v);}catch(e){}
}

/* ---------- wiring ---------- */
[].forEach.call(document.querySelectorAll(".tabs button"),function(b){
  b.addEventListener("click",function(){setView(b.dataset.view);});
});
window.addEventListener("hashchange",function(){
  var v=location.hash.slice(1);
  if(v==="board"||v==="notes"||v==="shop"||v==="meals") setView(v,{updateHash:false});
  else if(v==="new-note"||v==="new-task"){ui.action=v;runAction();}
});
$("#acct").addEventListener("click",openAccount);

var qsel=$("#qa-quad");
QUADS.forEach(function(q){qsel.append(el("option",{value:q.id,text:q.name}));});
qsel.addEventListener("change",function(){ui.lastQuad=qsel.value;});
$("#quick-add").addEventListener("submit",function(e){
  e.preventDefault();
  var inp=$("#qa-title"), v=inp.value.trim();
  if(!v||mode==="connecting") return;
  addTask(v,qsel.value);
  inp.value=""; inp.focus();
});
var cd=$("#clear-done");
cd.addEventListener("click",function(){
  allTasks().forEach(function(x){if(x.done){items.delete(x.id);persist(x.id);}});
  renderBoard();
});

$("#new-folder").append(icon("plus",16),"New folder");
$("#back-notes").append(icon("back"),"Notes");
$("#back-list").append(icon("back"),"Notes");
$("#open-folders").append(icon("folder"),"Folders");
$("#new-note-m").append(icon("plus"),"New note");
$("#new-folder").addEventListener("click",function(){openFolderSheet(null);});
$("#new-note").addEventListener("click",createNote);
$("#new-note-m").addEventListener("click",createNote);
$("#open-folders").addEventListener("click",function(){
  if(ui.noteId) dropIfEmpty(ui.noteId);
  ui.noteId=null; ui.pane="folders"; renderAll();
});
$("#back-notes").addEventListener("click",function(){
  ui.pane="list"; renderAll();
});
$("#back-list").addEventListener("click",function(){
  if(ui.noteId) dropIfEmpty(ui.noteId);
  ui.noteId=null; ui.pane="list"; renderAll();
});
$("#search").addEventListener("input",function(){
  ui.query=this.value; renderFolders(); renderList();
});
$("#note-body").addEventListener("input",function(){
  var id=ui.noteId, n=id&&items.get(id);
  if(!n) return;
  var upd=Object.assign({},n,{body:this.value,updatedAt:Date.now()});
  items.set(id,upd);
  scheduleNote(id);
  renderList(); renderEditorMeta({body:upd.body,updatedAt:upd.updatedAt});
  renderFolders();
});
$("#note-folder").addEventListener("change",function(){
  var id=ui.noteId, n=id&&items.get(id);
  if(!n) return;
  items.set(id,Object.assign({},n,{folderId:this.value||null,manual:true}));
  persist(id); renderFolders(); renderList();
});
$("#pin-note").addEventListener("click",function(){
  var id=ui.noteId, n=id&&items.get(id);
  if(!n) return;
  items.set(id,Object.assign({},n,{pinned:!n.pinned}));
  persist(id); renderList(); renderEditor();
});
armBtn($("#del-note"),"Delete","Tap again to delete",function(){
  var id=ui.noteId; if(!id) return;
  var t=timers.get(id); if(t){clearTimeout(t);timers.delete(id);}
  items.delete(id); persist(id);
  ui.noteId=null; ui.pane="list"; renderAll();
});

document.addEventListener("visibilitychange",function(){if(document.visibilityState==="hidden") flushAll();});
window.addEventListener("pagehide",flushAll);

init();
})();
</script>
